[project]
name = "toolkit"
version = "1.0.0"
description = "Builds the Freelancer Finance Kit: four .xlsx templates, a PDF guide and the zip."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "reportlab>=4.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
