<style>
/* Layout: one column styled like the paper test sheet — numbered question, tick-box answers; a home screen with three ways to play. */
:root {
  --paper: #f3f5f7; --sheet: #ffffff; --ink: #15233a; --muted: #5a6779; --line: #d8dee6;
  --red: #c8102e; --red-soft: #fbe7ea; --ok: #1c7a4b; --ok-soft: #e2f3e9; --gold: #a86b00; --gold-soft: #fbf0d9;
  --f-q: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui: "Libre Franklin", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1520; --sheet: #172131; --ink: #e6ecf4; --muted: #96a3b5; --line: #29364a;
  --red: #ff6b7d; --red-soft: #3b1d25; --ok: #6fd3a0; --ok-soft: #16322a; --gold: #f0b552; --gold-soft: #33280f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1520; --sheet: #172131; --ink: #e6ecf4; --muted: #96a3b5; --line: #29364a;
  --red: #ff6b7d; --red-soft: #3b1d25; --ok: #6fd3a0; --ok-soft: #16322a; --gold: #f0b552; --gold-soft: #33280f; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 56px; display: grid; gap: 18px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.brand { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.flag { width: 18px; height: 13px; background: var(--red); position: relative; border-radius: 1px; flex: none; }
.flag::before, .flag::after { content: ""; position: absolute; background: var(--sheet); }
.flag::before { left: 5px; top: 0; bottom: 0; width: 2.5px; }
.flag::after { top: 5px; left: 0; right: 0; height: 2.5px; }
h1 { font: 650 clamp(30px, 7vw, 42px)/1.05 var(--f-q); margin: 0; letter-spacing: -.01em; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--sheet); }
.lang button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fact { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.fact b { display: block; font: 650 24px/1.1 var(--f-q); font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); }
.modes { display: grid; gap: 10px; }
.mode { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.mode:hover { border-color: var(--ink); }
.mode h2 { font: 650 21px var(--f-q); margin: 0; }
.mode p { margin: 0; color: var(--muted); grid-column: 1; }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font-size: 22px; color: var(--red); }
.mode.exam { border-left: 4px solid var(--red); }
.mode .best { font-size: 12px; font-weight: 600; color: var(--ok); grid-column: 1; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.cat .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.cat:hover { border-color: var(--ink); }
.sec-title { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note a { color: var(--ink); }

/* question sheet */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.quit { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.hud { display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.hud .t.low { color: var(--red); }
.lives { letter-spacing: 2px; color: var(--red); }
.progress { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink); transition: width .25s; }
.timerbar { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.timerbar i { display: block; height: 100%; background: var(--red); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; display: grid; gap: 16px; }
.qhead { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.qhead .tag.val { color: var(--gold); }
.q { font: 500 clamp(21px, 4.6vw, 25px)/1.3 var(--f-q); margin: 0; text-wrap: balance; }
.q-en { color: var(--muted); font-style: italic; margin: -8px 0 0; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; font-size: 16px; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.box { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 3px; display: grid; place-items: center; font-weight: 700; font-size: 15px; line-height: 1; margin-top: 1px; }
.opt .en { display: block; color: var(--muted); font-size: 13px; font-style: italic; }
.opt.chosen .box::after { content: "✕"; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right .box { border-color: var(--ok); color: var(--ok); }
.opt.right .box::after { content: "✓"; }
.opt.wrong { background: var(--red-soft); border-color: var(--red); }
.opt.wrong .box { border-color: var(--red); color: var(--red); }
.opt.wrong .box::after { content: "✕"; }
.opt[disabled] { cursor: default; }
.explain { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.explain b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.explain.good b { color: var(--ok); } .explain.bad b { color: var(--red); }
.explain p { margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 600; cursor: pointer; background: var(--ink); color: var(--sheet); }
.btn.ghost { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); }
.btn.red { background: var(--red); color: #fff; }
.flash { font: 700 15px var(--f-ui); color: var(--gold); min-height: 1.4em; text-align: center; }

/* results */
.result { display: grid; gap: 14px; }
.verdict { font: 650 clamp(30px, 7vw, 40px)/1.05 var(--f-q); margin: 0; }
.verdict.pass { color: var(--ok); } .verdict.fail { color: var(--red); }
.score-rows { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.srow .meter { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.srow .meter i { display: block; height: 100%; background: var(--ink); }
.srow .meter u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--red); }
.srow b { font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.review li { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.review .yours { color: var(--red); font-size: 13px; }
.review .right { color: var(--ok); font-weight: 600; }
.review .x { color: var(--muted); font-size: 13px; }
@media (max-width: 520px) { .facts { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app">
  <header>

      <div class="eyebrow"><span class="flag" aria-hidden="true"></span>Træning til indfødsretsprøven</div>

  <main id="view"></main>
</div>

};
const Q = [
// ---------- Historie ----------
["hist","Hvornår fik Danmark sin første grundlov?","When did Denmark get its first constitution?",[["1849","1849"],["1660","1660"],["1915","1915"]],"Grundloven blev underskrevet den 5. juni 1849. Den gjorde Danmark til et konstitutionelt monarki og afskaffede enevælden."],
["hist","Hvilken konge underskrev Grundloven i 1849?","Which king signed the constitution in 1849?",[["Frederik 7.","Frederick VII"],["Christian 4.","Christian IV"],["Christian 10.","Christian X"]],"Frederik 7. underskrev Grundloven den 5. juni 1849."],
["hist","Hvornår blev enevælden indført i Danmark?","When was absolute monarchy introduced in Denmark?",[["1660","1660"],["1536","1536"],["1849","1849"]],"Enevælden blev indført i 1660 under Frederik 3. og varede til 1849."],
["hist","Hvornår fik kvinder valgret til Folketinget?","When did women get the right to vote for the Folketing?",[["1915","1915"],["1849","1849"],["1953","1953"]],"Med grundlovsændringen i 1915 fik kvinder og tjenestefolk valgret til Rigsdagen."],
["hist","Hvornår blev Danmark besat af Tyskland?","When was Denmark occupied by Germany?",[["9. april 1940","9 April 1940"],["29. august 1943","29 August 1943"],["1. september 1939","1 September 1939"]],"Tyske tropper besatte Danmark om morgenen den 9. april 1940."],
["hist","Hvornår blev Danmark befriet efter besættelsen?","When was Denmark liberated after the occupation?",[["5. maj 1945","5 May 1945"],["9. april 1945","9 April 1945"],["8. august 1946","8 August 1946"]],"Befrielsesbudskabet kom om aftenen den 4. maj, og kapitulationen trådte i kraft den 5. maj 1945. Bornholm blev dog først befriet senere."],
["hist","Hvad skete der den 29. august 1943?","What happened on 29 August 1943?",[["Samarbejdspolitikken med besættelsesmagten brød sammen","The policy of cooperation with the occupiers broke down"],["Danmark blev befriet","Denmark was liberated"],["Danmark blev medlem af NATO","Denmark joined NATO"]],"Efter strejker og uroligheder gik regeringen af, og samarbejdet med tyskerne ophørte den 29. august 1943."],
["hist","Hvor flygtede de fleste danske jøder hen i oktober 1943?","Where did most Danish Jews flee to in October 1943?",[["Sverige","Sweden"],["Norge","Norway"],["England","England"]],"Med hjælp fra almindelige danskere blev de fleste danske jøder sejlet over Øresund til Sverige."],
["hist","Hvilke landsdele mistede Danmark til Sverige i 1658?","Which regions did Denmark lose to Sweden in 1658?",[["Skåne, Halland og Blekinge","Scania, Halland and Blekinge"],["Slesvig og Holsten","Schleswig and Holstein"],["Norge og Island","Norway and Iceland"]],"Ved freden i Roskilde 1658 mistede Danmark Skåne, Halland og Blekinge til Sverige."],
["hist","Hvornår mistede Danmark Norge?","When did Denmark lose Norway?",[["1814","1814"],["1658","1658"],["1905","1905"]],"Ved freden i Kiel i 1814 måtte Danmark afstå Norge til Sverige."],
["hist","Hvilke områder mistede Danmark efter krigen i 1864?","Which areas did Denmark lose after the war of 1864?",[["Hertugdømmerne Slesvig, Holsten og Lauenborg","The duchies of Schleswig, Holstein and Lauenburg"],["Skåne og Halland","Scania and Halland"],["Færøerne","The Faroe Islands"]],"Nederlaget til Preussen og Østrig i 1864 kostede Danmark hertugdømmerne, blandt andet slaget ved Dybbøl."],
["hist","Hvornår blev Sønderjylland genforenet med Danmark?","When was Southern Jutland reunited with Denmark?",[["1920","1920"],["1864","1864"],["1945","1945"]],"Efter en folkeafstemning blev Nordslesvig (Sønderjylland) genforenet med Danmark i 1920."],

["hist","Hvilken konge byggede blandt andet Rundetårn og Børsen i København?","Which king built, among other things, the Round Tower and the Stock Exchange in Copenhagen?",[["Christian 4.","Christian IV"],["Frederik 7.","Frederick VII"],["Harald Blåtand","Harald Bluetooth"]],"Christian 4. var konge 1588–1648 og byggede mange kendte bygninger."],
["hist","Hvornår blev stavnsbåndet ophævet?","When was the adscription (stavnsbånd) abolished?",[["1788","1788"],["1849","1849"],["1901","1901"]],"Stavnsbåndet bandt bønderne til det gods, de var født på. Det blev ophævet i 1788 som en del af landboreformerne."],

["hist","Hvem var Danmarks dronning fra 1972 til 2024?","Who was Denmark's queen from 1972 to 2024?",[["Margrethe 2.","Margrethe II"],["Ingrid","Ingrid"],["Margrete 1.","Margaret I"]],"Dronning Margrethe 2. abdicerede den 14. januar 2024."],

// ---------- state & helpers ----------
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("proeveklar-" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("proeveklar-" + k, JSON.stringify(v)); } catch (e) {} }
};
let EN = store.get("en", false);
let missed = store.get("missed", {});        // question index -> times missed (cleared when answered right later)
let best = store.get("best", { exam: null, blitz: 0 });
let game = null, tick = null;

function setLang(en) {
  EN = en; store.set("en", en);
  $("#lang-da").setAttribute("aria-pressed", String(!en)); $("#lang-en").setAttribute("aria-pressed", String(en));
  if (game) renderQuestion(); else home();
}
$("#lang-da").onclick = () => setLang(false);
$("#lang-en").onclick = () => setLang(true);

const valIdx = Q.map((q, i) => q[0] === "vaerdi" ? i : -1).filter(i => i >= 0);
const knowIdx = Q.map((q, i) => q[0] !== "vaerdi" ? i : -1).filter(i => i >= 0);
const byCat = c => Q.map((q, i) => q[0] === c ? i : -1).filter(i => i >= 0);

// ---------- home ----------
function home() {
  stopTimer(); game = null;
  const nMiss = Object.keys(missed).length;
  const counts = {}; Q.forEach(q => counts[q[0]] = (counts[q[0]] || 0) + 1);
  view.innerHTML = `
  <div style="display:grid;gap:18px">
    <div class="facts">
      <div class="fact"><b>45</b><span>spørgsmål</span></div>
      <div class="fact"><b>45</b><span>minutter</span></div>
      <div class="fact"><b>36</b><span>rigtige for at bestå</span></div>
      <div class="fact"><b>4 / 5</b><span>værdispørgsmål rigtige</span></div>
    </div>
    <div class="modes">
      <button class="mode exam" type="button" data-mode="exam"><h2>Prøveeksamen</h2><p>45 spørgsmål på 45 minutter, ligesom den rigtige prøve. Du ser svarene til sidst.</p>${best.exam ? `<span class="best">Bedste resultat: ${best.exam.score} / 45${best.exam.pass ? " · bestået" : ""}</span>` : ""}<span class="go" aria-hidden="true">→</span></button>
      <button class="mode" type="button" data-mode="blitz"><h2>Lynrunde</h2><p>15 sekunder pr. spørgsmål og 3 liv. Rigtige svar i træk giver bonuspoint.</p>${best.blitz ? `<span class="best">Rekord: ${best.blitz} point</span>` : ""}<span class="go" aria-hidden="true">→</span></button>
      ${nMiss ? `<button class="mode" type="button" data-mode="missed"><h2>Øv dine fejl</h2><p>${nMiss} spørgsmål, du har svaret forkert på. Svar rigtigt for at fjerne dem fra listen.</p><span class="go" aria-hidden="true">→</span></button>` : ""}
    </div>
    <div style="display:grid;gap:8px">
      <p class="sec-title">Øv ét emne i dit eget tempo</p>
      <div class="cats">${Object.entries(CATS).map(([k, v]) => `<button class="cat" type="button" data-cat="${k}">${esc(v)}<span class="n">${counts[k] || 0}</span></button>`).join("")}</div>
    </div>
    <p class="note">Spørgsmålene er skrevet til træning og er ikke de officielle prøvespørgsmål. Den rigtige prøve har 35 spørgsmål fra lærematerialet, 5 om aktuelle begivenheder og 5 om danske værdier. Aktuelle spørgsmål skifter fra prøve til prøve, så prøveeksamen her bruger 40 spørgsmål fra emnerne i stedet. Læs det officielle læremateriale hos <a href="https://siri.dk" target="_blank" rel="noopener">Styrelsen for International Rekruttering og Integration (siri.dk)</a>.</p>
  </div>`;
  view.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
  view.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => start("cat", b.dataset.cat));
}

// ---------- game setup ----------
function start(mode, cat) {
  let list;
  if (mode === "exam") list = shuffle(knowIdx).slice(0, 40).concat(shuffle(valIdx).slice(0, 5));
  else if (mode === "blitz") list = shuffle(Q.map((_, i) => i));
  else if (mode === "missed") list = shuffle(Object.keys(missed).map(Number));
  else list = shuffle(byCat(cat));
  game = { mode, cat, list, i: 0, answers: [], picked: null, order: [], score: 0, streak: 0, lives: 3, endAt: mode === "exam" ? Date.now() + 45 * 60e3 : 0, qEnd: 0 };
  nextQuestion(true);
}
function nextQuestion(first) {
  if (!first) game.i++;
  if (game.i >= game.list.length || (game.mode === "blitz" && game.lives <= 0)) return finish();
  const q = Q[game.list[game.i]];
  game.order = shuffle(q[3].map((o, k) => k));
  game.picked = null;
  if (game.mode === "blitz") game.qEnd = Date.now() + 15e3;
  renderQuestion(); startTimer();
}

// ---------- timers ----------
function startTimer() {
  stopTimer();
  if (game.mode !== "exam" && game.mode !== "blitz") return;
  tick = setInterval(() => {
    const now = Date.now();
    if (game.mode === "exam") {
      const left = Math.max(0, game.endAt - now), el = $("#clock");
      if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 5 * 60e3); }
      if (left <= 0) { stopTimer(); finish(true); }
    } else if (game.picked === null) {
      const left = Math.max(0, game.qEnd - now), bar = $("#tbar"), el = $("#clock");
      if (bar) bar.style.width = (left / 15e3 * 100) + "%";
      if (el) { el.textContent = Math.ceil(left / 1000) + " s"; el.classList.toggle("low", left < 5e3); }
      if (left <= 0) answer(-1);
    }
  }, 200);
}
function stopTimer() { clearInterval(tick); tick = null; }
const fmt = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

// ---------- question view ----------
function renderQuestion() {
  const g = game, qi = g.list[g.i], q = Q[qi], isVal = q[0] === "vaerdi", n = g.list.length;
  const showFeedback = g.picked !== null && g.mode !== "exam";
  const hud = g.mode === "exam" ? `<span class="t" id="clock">${fmt(g.endAt - Date.now())}</span>`
    : g.mode === "blitz" ? `<span class="lives" aria-label="${g.lives} liv">${"♥".repeat(g.lives)}${"♡".repeat(3 - g.lives)}</span><span>${g.score} point</span><span class="t" id="clock">15 s</span>`
    : `<span>${g.answers.filter(a => a.ok).length} rigtige</span>`;
  view.innerHTML = `
  <div style="display:grid;gap:12px">
    <div class="bar"><button class="quit" type="button" id="quit">← Afslut</button><div class="hud">${hud}</div></div>
    ${g.mode === "blitz" ? `<div class="timerbar"><i id="tbar" style="width:${g.picked === null ? Math.max(0, (g.qEnd - Date.now()) / 150) : 0}%"></i></div>` : `<div class="progress"><i style="width:${g.i / n * 100}%"></i></div>`}
    <article class="sheet">
      <div class="qhead"><span>Spørgsmål ${g.i + 1}${g.mode === "blitz" ? "" : ` af ${n}`}</span><span class="tag${isVal ? " val" : ""}">${esc(CATS[q[0]])}</span></div>
      <h2 class="q">${esc(q[1])}</h2>
      ${EN ? `<p class="q-en">${esc(q[2])}</p>` : ""}
      <div class="opts">${g.order.map(k => {
        const o = q[3][k]; let cls = "";
        if (g.picked !== null) {
          if (g.mode === "exam") cls = k === g.picked ? " chosen" : "";
          else cls = k === 0 ? " right" : k === g.picked ? " wrong" : "";
        }
        return `<button class="opt${cls}" type="button" data-k="${k}"${g.picked !== null && g.mode !== "exam" ? " disabled" : ""}><span class="box" aria-hidden="true"></span><span>${esc(o[0])}${EN ? `<span class="en">${esc(o[1])}</span>` : ""}</span></button>`;
      }).join("")}</div>
      ${showFeedback ? `<div class="explain ${g.picked === 0 ? "good" : "bad"}"><b>${g.picked === 0 ? "Rigtigt" : g.picked === -1 ? "Tiden løb ud" : "Forkert"}</b><p>${esc(q[4])}</p></div>` : ""}
      <div class="flash" id="flash">${g.mode === "blitz" && g.picked === 0 && g.streak >= 3 ? `${g.streak} i træk · bonus ×${Math.min(3, 1 + Math.floor(g.streak / 3))}` : ""}</div>
      <div class="actions">
        ${g.mode === "exam" && g.i > 0 ? `<button class="btn ghost" type="button" id="prev">← Forrige</button>` : ""}
        ${g.mode === "exam" ? `<button class="btn${g.i === n - 1 ? " red" : ""}" type="button" id="next"${g.picked === null ? " disabled style=\"opacity:.45\"" : ""}>${g.i === n - 1 ? "Aflever prøven" : "Næste →"}</button>`
          : showFeedback ? `<button class="btn" type="button" id="next">${g.mode === "blitz" && g.lives <= 0 ? "Se resultat" : g.i === n - 1 ? "Se resultat" : "Næste →"}</button>` : ""}
      </div>
    </article>
  </div>`;
  $("#quit").onclick = () => { if (g.mode === "exam" && g.answers.length) finish(); else home(); };
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  const nx = $("#next"); if (nx) nx.onclick = () => { if (g.mode === "exam" && g.picked === null) return; nextQuestion(); };
  const pv = $("#prev"); if (pv) pv.onclick = () => { g.i--; g.order = g.answers[g.i].order; g.picked = g.answers[g.i].picked; renderQuestion(); };
  (showFeedback ? nx : view.querySelector(".opt"))?.focus({ preventScroll: true });
}

function answer(k) {
  const g = game; if (g.mode !== "exam" && g.picked !== null) return;
  const qi = g.list[g.i], ok = k === 0;
  g.picked = k;
  g.answers[g.i] = { qi, picked: k, ok, order: g.order };
  if (g.mode !== "exam") {
    if (ok) { if (missed[qi]) { delete missed[qi]; } } else missed[qi] = (missed[qi] || 0) + 1;
    store.set("missed", missed);
  }
  if (g.mode === "blitz") {
    if (ok) { g.streak++; g.score += 10 * Math.min(3, 1 + Math.floor(g.streak / 3)); }
    else { g.streak = 0; g.lives--; }
  }
  renderQuestion();
}

// ---------- results ----------
function finish(timeUp) {
  stopTimer();
  const g = game, ans = g.answers.filter(Boolean);
  if (g.mode === "exam") {
    // unanswered questions count as wrong
    const all = g.list.map((qi, i) => g.answers[i] || { qi, picked: null, ok: false });
    all.forEach(a => { if (a.ok) delete missed[a.qi]; else missed[a.qi] = (missed[a.qi] || 0) + 1; }); store.set("missed", missed);
    const score = all.filter(a => a.ok).length;
    const valOk = all.filter(a => Q[a.qi][0] === "vaerdi" && a.ok).length;
    const pass = score >= 36 && valOk >= 4;
    if (!best.exam || score > best.exam.score) { best.exam = { score, pass }; store.set("best", best); }
    const wrong = all.filter(a => !a.ok);
    const byC = {}; all.forEach(a => { const c = Q[a.qi][0]; byC[c] = byC[c] || [0, 0]; byC[c][1]++; if (a.ok) byC[c][0]++; });
    view.innerHTML = `<section class="result">
      <div class="sheet">
        <div class="qhead"><span>${timeUp ? "Tiden er gået" : "Prøven er afleveret"}</span><span>Prøveeksamen</span></div>
        <h2 class="verdict ${pass ? "pass" : "fail"}">${pass ? "Bestået" : "Ikke bestået"}</h2>
        <div class="score-rows">
          <div class="srow"><span>Rigtige svar i alt</span><b>${score} / 45</b><div class="meter"><i style="width:${score / 45 * 100}%"></i><u style="left:${36 / 45 * 100}%"></u></div></div>
          <div class="srow"><span>Værdispørgsmål</span><b>${valOk} / 5</b><div class="meter"><i style="width:${valOk / 5 * 100}%"></i><u style="left:80%"></u></div></div>
        </div>
        <p class="note">Den røde streg viser kravet: 36 rigtige i alt og mindst 4 af 5 værdispørgsmål.${!pass ? (score < 36 ? ` Du manglede ${36 - score} rigtige.` : " Du havde nok rigtige i alt, men for få værdispørgsmål.") : ""}</p>
        <div class="score-rows">${Object.entries(byC).map(([c, [o, t]]) => `<div class="srow"><span>${esc(CATS[c])}</span><b>${o} / ${t}</b><div class="meter"><i style="width:${o / t * 100}%"></i></div></div>`).join("")}</div>
        <div class="actions"><button class="btn ghost" type="button" id="home">Til forsiden</button><button class="btn" type="button" id="again">Ny prøveeksamen</button></div>
      </div>
      ${wrong.length ? `<p class="sec-title">Dine ${wrong.length} forkerte svar</p><ul class="review">${wrong.map(reviewItem).join("")}</ul>` : `<p class="note">Alle svar var rigtige.</p>`}
    </section>`;
    $("#again").onclick = () => start("exam");
  } else {
    const ok = ans.filter(a => a.ok).length, wrong = ans.filter(a => !a.ok);
    let head;
    if (g.mode === "blitz") {
      const rec = g.score > (best.blitz || 0); if (rec) { best.blitz = g.score; store.set("best", best); }
      head = `<h2 class="verdict pass">${g.score} point</h2><p class="note">${ok} rigtige ud af ${ans.length}.${rec ? " Ny rekord!" : ` Din rekord er ${best.blitz} point.`}</p>`;
    } else head = `<h2 class="verdict ${ok === ans.length ? "pass" : ""}">${ok} af ${ans.length} rigtige</h2><p class="note">${g.mode === "cat" ? esc(CATS[g.cat]) : "Øv dine fejl"}</p>`;
    view.innerHTML = `<section class="result"><div class="sheet">${head}
      <div class="actions"><button class="btn ghost" type="button" id="home">Til forsiden</button><button class="btn" type="button" id="again">Spil igen</button></div></div>
      ${wrong.length ? `<p class="sec-title">Dem du skal øve</p><ul class="review">${wrong.map(reviewItem).join("")}</ul>` : ""}</section>`;
    $("#again").onclick = () => start(g.mode === "missed" && !Object.keys(missed).length ? "blitz" : g.mode, g.cat);
  }
  $("#home").onclick = home;
  game = null;
  window.scrollTo(0, 0);
}
function reviewItem(a) {
  const q = Q[a.qi];
  return `<li><span>${esc(q[1])}${EN ? ` <span class="x">· ${esc(q[2])}</span>` : ""}</span>
    ${a.picked !== null && a.picked >= 0 ? `<span class="yours">Dit svar: ${esc(q[3][a.picked][0])}</span>` : `<span class="yours">Ikke besvaret</span>`}
    <span class="right">Rigtigt svar: ${esc(q[3][0][0])}</span><span class="x">${esc(q[4])}</span></li>`;
}

document.addEventListener("keydown", e => {
  if (!game) return;
  const n = +e.key;
  if (n >= 1 && n <= 3) { const b = view.querySelectorAll(".opt")[n - 1]; if (b && !b.disabled) b.click(); }
  else if (e.key === "Enter") { const nx = $("#next"); if (nx && document.activeElement?.tagName !== "BUTTON") nx.click(); }
});

setLang(EN);
</script>
