name: Kite alert

on:
  schedule:
    # GitHub cron is UTC. Copenhagen is UTC+1 (winter) / UTC+2 (summer).
    - cron: "43 5 * * *"   # morning check, ~06:43 / 07:43 Copenhagen
    - cron: "43 15 * * *"  # afternoon check, ~16:43 / 17:43 Copenhagen
  workflow_dispatch:
    inputs:
      test:
        description: "Send a notification even if conditions are not good (setup check)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s kite-alert
      - name: Check forecast and notify
        run: python3 kite-alert/kite_alert.py
        env:
          KITE_TEST: ${{ inputs.test }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
